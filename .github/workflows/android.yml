name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bauen und testen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: ./gradlew testDebugUnitTest

      - name: APK bauen
        run: ./gradlew assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk Punktjaeger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Punktjaeger-APK
          path: Punktjaeger.apk
          if-no-files-found: error

  smoke-test:
    name: Im Emulator testen
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Punktjaeger-APK

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: App starten und eine Runde spielen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/smoke-test.sh Punktjaeger.apk smoke-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Screenshots
          path: smoke-test/

      - name: Screenshots verkleinert ins Log schreiben
        if: always()
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import base64, glob, io
          from PIL import Image
          for path in sorted(glob.glob("smoke-test/*.png")):
              img = Image.open(path).convert("RGB")
              img.thumbnail((480, 1100))
              buf = io.BytesIO()
              img.save(buf, "JPEG", quality=70)
              print("SCREENSHOT", path, base64.b64encode(buf.getvalue()).decode())
          PY

  release:
    name: Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Punktjaeger-APK

      - uses: softprops/action-gh-release@v2
        with:
          files: Punktjaeger.apk
          generate_release_notes: true
